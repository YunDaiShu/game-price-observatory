name: daily-price-scan

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10，每天一次
    - cron: '10 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-price-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run price scan
        id: scan
        run: node src/index.mjs

      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history docs/index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): daily scan $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '每日抓取失败：' + new Date().toISOString().slice(0,10);
            const body = [
              '自动抓取任务失败，请检查 fetchers 是否因站点改版而失效。',
              '',
              '- 运行日志：' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- 排查方法见 docs/ADD-A-SOURCE.md',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automation']
            });
