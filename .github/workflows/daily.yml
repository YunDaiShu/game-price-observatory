name: daily-price-scan

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10，每天一次
    - cron: '10 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-price-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run price scan
        id: scan
        run: node src/index.mjs

      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): daily scan $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '每日抓取失败：' + new Date().toISOString().slice(0,10);
            const body = [
              '自动抓取任务失败，请检查 fetchers 是否因站点改版而失效。',
              '',
              '- 运行日志：' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- 排查方法见 docs/ADD-A-SOURCE.md',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automation']
            });

      - name: Close stale failure issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // 抓取成功后，把历史遗留的失败 issue 自动关闭，避免常开堆积
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation',
              per_page: 100,
            });
            const stale = issues.filter((i) => !i.pull_request && i.title.startsWith('每日抓取失败'));
            for (const i of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: i.number,
                body: '本次抓取已恢复正常，自动关闭。',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: i.number,
                state: 'closed',
              });
            }
            core.info('closed ' + stale.length + ' stale issue(s)');
